<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEditor — auth-flow</title>
<meta name="seditor-launcher" content="embed-v1">
<meta name="seditor-editor-sha256" content="b586f611b94849d49dc2b28ca0720beff38e0f5f89a41d0e8b06d0be4c2205ad">
<style>
  html,body{height:100%;margin:0;background:#0b0d14;color:#f4f6ff;font:13px/1.6 ui-monospace,monospace}
  .wrap{display:flex;height:100%;align-items:center;justify-content:center;padding:16px;text-align:center}
  .hint{max-width:min(620px,calc(100vw - 32px));padding:12px 16px;background:#161a28;border:2px solid #39405e;color:#aab2d0}
  code{color:#f7d51d;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">
    Открываю схему <code>../assets/example-scheme.json</code> в SEditor…<br>
    Если редактор не открылся, откройте <code>../app/editor.html</code> вручную,<br>
    либо запустите backend из папки схем: <code>node ../app/server.js</code>
  </div>
</div>
<!-- Данные схемы лежат внутри ярлыка: так редактор открывается двойным кликом
     (file://) без локального сервера. Ярлык перегенерируется при каждой записи схемы. -->
<script type="application/json" id="seditor-schema">{"version":1,"meta":{"name":"auth-flow"},"nodes":[{"id":"n1","type":"shape","position":{"x":0,"y":80},"width":96,"height":96,"data":{"shape":"circle","label":"Start"}},{"id":"n2","type":"shape","position":{"x":200,"y":72},"width":112,"height":112,"data":{"shape":"diamond","label":"Token valid?"}},{"id":"n3","type":"shape","position":{"x":440,"y":0},"width":160,"height":80,"data":{"shape":"rect","label":"Allow request"}},{"id":"n4","type":"shape","position":{"x":440,"y":160},"width":160,"height":80,"data":{"shape":"rect","label":"Return 401"}}],"edges":[{"id":"e1","source":"n1","target":"n2","sourceHandle":"right","targetHandle":"left"},{"id":"e2","source":"n2","target":"n3","sourceHandle":"right","targetHandle":"left","data":{"label":"yes"}},{"id":"e3","source":"n2","target":"n4","sourceHandle":"bottom","targetHandle":"left","data":{"label":"no"}}]}</script>
<script>
  (function () {
    var holder = document.getElementById('seditor-schema');
    location.replace(
      "../app/editor.html" +
      '#d=' + encodeURIComponent(holder.textContent) +
      '&p=' + encodeURIComponent("../assets/example-scheme.json")
    );
  })();
</script>
</body>
</html>
